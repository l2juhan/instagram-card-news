<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Content Stat</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<style>
  /* === Toss Design System (TDS) 토큰 — 실제 토스 디자인 시스템 컬러 ===
     출처: TDS Foundation Colors. 다크 테마 카드뉴스용 시맨틱 매핑. */
  :root {
    --tds-grey-50:#F9FAFB; --tds-grey-400:#B0B8C1; --tds-grey-500:#8B95A1;
    --tds-grey-600:#6B7684; --tds-grey-700:#4E5968; --tds-grey-800:#333D4B;
    --tds-grey-900:#191F28;
    --tds-blue-400:#4593FC; --tds-blue-500:#3182F6; --tds-blue-600:#2272EB;
    --tds-red-300:#FB8890; --tds-red-400:#F66570; --tds-red-500:#F04452;
    --tds-green-300:#3FD599; --tds-green-400:#15C47E; --tds-green-500:#03B26C;
    /* 다크 테마 시맨틱 (grey900 base + greyOpacity 레이어링) */
    --tds-bg:var(--tds-grey-900);
    --tds-surface:#232A35;            /* TDS 다크 레이어드 표면 (grey900 + greyOpacityWhite) */
    --tds-text-strong:#FFFFFF;        /* 다크 테마 1차 텍스트 */
    --tds-text-weak:var(--tds-grey-500);
    --tds-text-subtle:var(--tds-grey-700);
    --tds-primary:var(--tds-blue-500);  /* Toss Blue */
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px;
    height: 1350px;
    background: var(--tds-bg);
    font-family: 'Pretendard', -apple-system, sans-serif;
    overflow: hidden;
    position: relative;
  }
  .container {
    width: 100%;
    height: 100%;
    padding: 80px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .label {
    font-size: 30px;
    font-weight: 600;
    color: var(--tds-text-weak);
    letter-spacing: 0.02em;
    margin-bottom: 32px;
  }
  .emphasis {
    font-size: 180px;
    font-weight: 800;
    color: {{accent_color}};
    line-height: 1;
    letter-spacing: -0.02em;
  }
  .accent-line {
    width: 56px;
    height: 4px;
    background: {{accent_color}};
    margin-top: 24px;
    opacity: 0.4;
  }
  .body {
    margin-top: 56px;
    font-size: 34px;
    font-weight: 400;
    color: var(--tds-text-weak);
    line-height: 1.7;
    white-space: pre-line;
  }
  .footer {
    position: absolute;
    bottom: 40px;
    left: 80px;
    right: 80px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 18px;
    color: var(--tds-text-subtle);
  }
</style>
</head>
<body>
  <div class="container">
    <div class="label">{{headline}}</div>
    <div class="emphasis">{{emphasis}}</div>
    <div class="accent-line"></div>
    <div class="body">{{body}}</div>
  </div>
  <div class="footer">
    <span>@{{account_name}}</span>
    <span>{{slide_number}} / {{total_slides}}</span>
  </div>
</body>
</html>
