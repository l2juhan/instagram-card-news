<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Content Highlight</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<style>
  /* === Toss Design System (TDS) 토큰 — 실제 토스 디자인 시스템 컬러 ===
     출처: TDS Foundation Colors. 다크 테마 카드뉴스용 시맨틱 매핑. */
  :root {
    --tds-grey-50:#F9FAFB; --tds-grey-400:#B0B8C1; --tds-grey-500:#8B95A1;
    --tds-grey-600:#6B7684; --tds-grey-700:#4E5968; --tds-grey-800:#333D4B;
    --tds-grey-900:#191F28;
    --tds-blue-400:#4593FC; --tds-blue-500:#3182F6; --tds-blue-600:#2272EB;
    --tds-red-300:#FB8890; --tds-red-400:#F66570; --tds-red-500:#F04452;
    --tds-green-300:#3FD599; --tds-green-400:#15C47E; --tds-green-500:#03B26C;
    /* 다크 테마 시맨틱 (grey900 base + greyOpacity 레이어링) */
    --tds-bg:var(--tds-grey-900);
    --tds-surface:#232A35;            /* TDS 다크 레이어드 표면 (grey900 + greyOpacityWhite) */
    --tds-text-strong:#FFFFFF;        /* 다크 테마 1차 텍스트 */
    --tds-text-weak:var(--tds-grey-500);
    --tds-text-subtle:var(--tds-grey-700);
    --tds-primary:var(--tds-blue-500);  /* Toss Blue */
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px;
    height: 1350px;
    background: var(--tds-bg);
    font-family: 'Pretendard', -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    padding: 80px 72px 60px;
    overflow: hidden;
  }
  .headline {
    font-size: 36px;
    font-weight: 500;
    color: var(--tds-text-weak);
    line-height: 1.4;
    margin-bottom: 48px;
    white-space: pre-line;
  }
  .highlight-card {
    background: var(--tds-surface);
    border-radius: 16px;
    padding: 48px;
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  .emphasis {
    font-size: 68px;
    font-weight: 700;
    color: {{accent_color}};
    line-height: 1.2;
    white-space: pre-line;
  }
  .divider {
    height: 1px;
    background: rgba(255, 255, 255, 0.06);
    margin: 40px 0;
    flex-shrink: 0;
  }
  .body-text {
    font-size: 32px;
    font-weight: 400;
    color: var(--tds-text-weak);
    line-height: 1.7;
    white-space: pre-line;
    flex: 1;
  }
  .subtext {
    font-size: 18px;
    color: var(--tds-text-subtle);
    margin-top: 40px;
    white-space: pre-line;
  }
  .footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 48px;
    flex-shrink: 0;
  }
  .footer-account {
    font-size: 18px;
    color: var(--tds-text-subtle);
  }
  .footer-slide {
    font-size: 18px;
    color: var(--tds-text-subtle);
  }
</style>
</head>
<body>
  <div class="headline">{{headline}}</div>
  <div class="highlight-card">
    <div class="emphasis">{{emphasis}}</div>
    <div class="divider"></div>
    <div class="body-text">{{body}}</div>
  </div>
  <div class="subtext">{{subtext}}</div>
  <div class="footer">
    <span class="footer-account">@{{account_name}}</span>
    <span class="footer-slide">{{slide_number}} / {{total_slides}}</span>
  </div>
</body>
</html>
