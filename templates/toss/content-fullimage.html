<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toss Full Image</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<style>
  /* === Toss Design System (TDS) 토큰 — 실제 토스 디자인 시스템 컬러 ===
     출처: TDS Foundation Colors. 다크 테마 카드뉴스용 시맨틱 매핑. */
  :root {
    --tds-grey-50:#F9FAFB; --tds-grey-400:#B0B8C1; --tds-grey-500:#8B95A1;
    --tds-grey-600:#6B7684; --tds-grey-700:#4E5968; --tds-grey-800:#333D4B;
    --tds-grey-900:#191F28;
    --tds-blue-400:#4593FC; --tds-blue-500:#3182F6; --tds-blue-600:#2272EB;
    --tds-red-300:#FB8890; --tds-red-400:#F66570; --tds-red-500:#F04452;
    --tds-green-300:#3FD599; --tds-green-400:#15C47E; --tds-green-500:#03B26C;
    /* 다크 테마 시맨틱 (grey900 base + greyOpacity 레이어링) */
    --tds-bg:var(--tds-grey-900);
    --tds-surface:#232A35;            /* TDS 다크 레이어드 표면 (grey900 + greyOpacityWhite) */
    --tds-text-strong:#FFFFFF;        /* 다크 테마 1차 텍스트 */
    --tds-text-weak:var(--tds-grey-500);
    --tds-text-subtle:var(--tds-grey-700);
    --tds-primary:var(--tds-blue-500);  /* Toss Blue */
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px;
    height: 1350px;
    font-family: 'Pretendard', -apple-system, sans-serif;
    position: relative;
    overflow: hidden;
  }

  .bg-fallback {
    position: absolute;
    inset: 0;
    background: var(--tds-bg);
  }

  .bg-image {
    position: absolute;
    inset: 0;
    background: url('{{image_url}}') center / cover no-repeat;
  }

  .overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(
      180deg,
      rgba(25, 31, 40, 0.82) 0%,
      rgba(25, 31, 40, 0.65) 40%,
      rgba(25, 31, 40, 0.82) 100%
    );
  }

  .content {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    padding: 100px 72px;
  }

  .headline {
    font-size: 64px;
    font-weight: 700;
    color: var(--tds-text-strong);
    text-align: center;
    line-height: 1.4;
    word-break: keep-all;
    margin-bottom: 56px;
  }

  .line-accent {
    color: {{accent_color}};
  }

  .line-white {
    color: var(--tds-text-strong);
  }

  .section {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 40px;
    width: 100%;
  }

  .pill-badge {
    display: inline-block;
    background: {{accent_color}};
    color: var(--tds-text-strong);
    font-size: 22px;
    font-weight: 600;
    padding: 12px 32px;
    border-radius: 60px;
    margin-bottom: 20px;
    white-space: nowrap;
  }

  .pill-badge-light {
    background: rgba(255, 255, 255, 0.08);
    color: var(--tds-grey-400);
    border: none;
  }

  .body-text {
    font-size: 28px;
    font-weight: 400;
    color: var(--tds-text-weak);
    text-align: center;
    line-height: 1.7;
    word-break: keep-all;
  }

  .footer {
    position: absolute;
    bottom: 40px;
    left: 72px;
    right: 72px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 3;
  }

  .footer-account {
    font-size: 18px;
    color: var(--tds-text-subtle);
  }

  .footer-slide {
    font-size: 18px;
    color: var(--tds-text-subtle);
  }
</style>
</head>
<body>
  <div class="bg-fallback"></div>
  <div class="bg-image" id="bgImage"></div>
  <div class="overlay"></div>

  <div class="content">
    <h1 class="headline" id="headline">{{headline}}</h1>

    <div class="section">
      <span class="pill-badge">{{badge_text}}</span>
      <p class="body-text">{{body}}</p>
    </div>

    <div class="section">
      <span class="pill-badge pill-badge-light">{{badge2_text}}</span>
      <p class="body-text">{{body2}}</p>
    </div>
  </div>

  <div class="footer">
    <span class="footer-account">@{{account_name}}</span>
    <span class="footer-slide">{{slide_number}} / {{total_slides}}</span>
  </div>

  <script>
    const el = document.getElementById('headline');
    const raw = el.innerHTML;
    const lines = raw.split(/<br\s*\/?>/i);
    el.innerHTML = lines.map((line, i) => {
      if (i === 0) return '<span class="line-accent">' + line.trim() + '</span>';
      return '<span class="line-white">' + line.trim() + '</span>';
    }).join('<br>');

    const bgEl = document.getElementById('bgImage');
    const bgUrl = bgEl.style.backgroundImage || window.getComputedStyle(bgEl).backgroundImage;
    if (!bgUrl || bgUrl === 'none' || bgUrl.includes("''") || bgUrl.includes('""')) {
      bgEl.style.display = 'none';
    }
  </script>
</body>
</html>
